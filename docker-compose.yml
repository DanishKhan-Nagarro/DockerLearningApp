services:
  backendapi:
    build:
      context: ./BackendApi
      dockerfile: Dockerfile
    image: dockerlearning-backend
    container_name: backend-container
    ports:
      - "8082:8080"

  frontendapp:
    build:
      context: ./FrontendApp
      dockerfile: Dockerfile
    image: dockerlearning-frontend
    container_name: frontend-container
    ports:
      - "8081:8080"
    depends_on:
      - backendapi
    environment:
      - BackendApiUrl=http://backendapi:8080/